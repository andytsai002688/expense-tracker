<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f9e6e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>輕鬆記帳</title>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--text:#1d2b25;--sub:#6b7a73;--line:#e3e8e5;
  --accent:#2f9e6e;--accent-text:#fff;--expense:#e0533d;--income:#2f9e6e;
  --warn:#f09a2b;--danger:#d64545;--chip:#edf1ef;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#111815;--card:#1a2420;--text:#e8efeb;--sub:#8fa098;--line:#2a3731;
    --accent:#3fbf86;--accent-text:#0c1511;--expense:#f0705a;--income:#3fbf86;--chip:#24302a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
h2{font-size:1.05rem;margin:18px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.sub{color:var(--sub);font-size:.85rem}
.exp{color:var(--expense)}.inc{color:var(--income)}
.btn{background:var(--chip);border:0;border-radius:10px;padding:10px 14px}
.btn.pri{background:var(--accent);color:var(--accent-text);font-weight:600}
.btn.dng{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.85rem}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:480px}
nav button{flex:1;border:0;background:none;padding:8px 0 10px;color:var(--sub);font-size:.75rem}
nav button b{display:block;font-size:1.4rem;font-weight:400}
nav button.on{color:var(--accent);font-weight:600}
.amount{text-align:right;font-size:2.4rem;font-weight:700;padding:6px 4px;word-break:break-all}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.cat{border:2px solid transparent;background:var(--card);border-radius:12px;padding:8px 2px;text-align:center;font-size:.8rem;border-color:var(--line)}
.cat i{display:block;font-style:normal;font-size:1.5rem}
.cat.on{border-color:var(--accent);background:var(--chip)}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pad button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 0;font-size:1.25rem}
.pad .save{grid-row:span 4;grid-column:4;background:var(--accent);color:var(--accent-text);font-weight:700;border:0}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.2rem;flex:none}
.day{display:flex;justify-content:space-between;color:var(--sub);font-size:.85rem;margin:14px 2px 4px}
.month{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px;font-weight:600}
.month button{background:none;border:0;font-size:1.3rem;padding:4px 12px}
.month .mbtn{font-size:1rem;font-weight:600;border-radius:10px;background:var(--chip)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:4px}
.sum b{display:block;font-size:1.1rem}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}
.bar span{display:block;height:100%;border-radius:6px}
.empty{text-align:center;color:var(--sub);padding:28px 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
#modal.show{display:flex}
#modal .box{background:var(--bg);width:100%;max-width:480px;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.field{margin-bottom:12px}
.field label{display:block;font-size:.85rem;color:var(--sub);margin-bottom:4px}
.emojis,.colors{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{width:40px;height:40px;font-size:1.3rem;border:2px solid transparent;background:var(--chip);border-radius:10px;padding:0}
.colors button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}
.emojis button.on,.colors button.on{border-color:var(--text)}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:.9rem;display:none;z-index:20;max-width:90%;text-align:center}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;font-size:.75rem;color:var(--sub);margin-left:6px}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="modal"><div class="box" id="box"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
'use strict';
const KEY = 'ledger.v1';
const COLORS = ['#e0533d','#f09a2b','#e8c43c','#7cb342','#2f9e6e','#2aa6b5','#3f7fd9','#7a5cd6','#c25cc0','#9aa0a6'];
const EMOJIS = ['🍜','🍱','☕','🛒','🚌','🚗','⛽','🏠','💡','📱','🎮','🎬','✈️','👕','💊','🏥','📚','🎓','🐶','🎁','💇','🏋️','👶','🧾','💰','🧧','📈','💼','🪙','✨','❤️','📦'];
const DEFAULT_CATS = [
  ['e_food','餐飲','🍜','#e0533d','expense'],['e_traffic','交通','🚌','#3f7fd9','expense'],
  ['e_shop','購物','🛒','#c25cc0','expense'],['e_fun','娛樂','🎮','#7a5cd6','expense'],
  ['e_home','居家','🏠','#f09a2b','expense'],['e_med','醫療','💊','#2aa6b5','expense'],
  ['e_edu','教育','📚','#7cb342','expense'],['e_other','其他支出','📦','#9aa0a6','expense'],
  ['i_salary','薪資','💼','#2f9e6e','income'],['i_bonus','獎金','🧧','#e8c43c','income'],
  ['i_other','其他收入','💰','#9aa0a6','income']
].map(([id,name,icon,color,type]) => ({id,name,icon,color,type,hidden:false}));
const NONE = {id:null,name:'未分類',icon:'❓',color:'#9aa0a6'};
const ACC_TYPES = [['cash','現金','💵'],['bank','銀行','🏦'],['card','信用卡','💳'],['wallet','電子支付','📱'],['other','其他','💼']];
function accType(k){ return ACC_TYPES.find(x => x[0] === k) || ACC_TYPES[4]; }
function defaultAccount(){ return {id:'a_cash', name:'現金', icon:'💵', type:'cash', initial:0}; }

let db = load();
ensureAccounts();
let st = {tab:'add', month:ym(new Date()), statType:'expense', catTab:'expense', range:savedRange(),
          draft:newDraft('expense')};

/* ---------- 資料 ---------- */
function ensureAccounts(){
  if(!Array.isArray(db.accounts) || !db.accounts.length) db.accounts = [defaultAccount()];
}
// 沒有 accId 的舊記錄一律算在第一個「現金」帳戶（沒有現金帳戶就算第一個帳戶）
function defaultAcc(){ return db.accounts.find(a => a.type === 'cash') || db.accounts[0]; }
function acc(id){ return db.accounts.find(a => a.id === id); }
function accOf(r){ return acc(r.accId) || defaultAcc(); }
function balances(){
  const b = new Map(db.accounts.map(a => [a.id, Number(a.initial) || 0]));
  const add = (id, v) => { if(b.has(id)) b.set(id, b.get(id) + v); };
  for(const r of db.records){
    if(r.type === 'transfer'){ add(accOf(r).id, -r.amount); const to = acc(r.toAccId); if(to) add(to.id, r.amount); }
    else add(accOf(r).id, r.type === 'income' ? r.amount : -r.amount);
  }
  for(const [k, v] of b) b.set(k, Math.round(v * 100) / 100);
  return b;
}
function totals(){
  const b = balances();
  let all = 0, cash = 0;
  for(const a of db.accounts){ const v = b.get(a.id); all += v; if(a.type === 'cash') cash += v; }
  return {b, all:Math.round(all * 100) / 100, cash:Math.round(cash * 100) / 100};
}
function accOptions(sel){
  return db.accounts.map(a => `<option value="${a.id}" ${a.id === sel ? 'selected' : ''}>${esc(a.icon)} ${esc(a.name)}</option>`).join('');
}
function rememberAcc(id){ try{ localStorage.setItem('ledger.acc', id); }catch(e){} }
function savedRange(){
  try{ const n = parseInt(localStorage.getItem('ledger.range')); if(n >= 1 && n <= 36) return n; }catch(e){}
  return 6;
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.categories && d.records) return d;
  }catch(e){}
  return {categories:structuredClone(DEFAULT_CATS), records:[], budgets:{total:0,cats:{}}, recurring:[]};
}
function save(localOnly){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast('儲存失敗，請先匯出備份'); }
  if(!localOnly && window.Sync) Sync.push();
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const cat = id => db.categories.find(c => c.id === id) || NONE;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(Number(n)).toLocaleString('zh-TW', {maximumFractionDigits:2});
const $ = id => document.getElementById(id);

/* ---------- 日期 ---------- */
function p2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function ym(d){ return d.getFullYear() + '-' + p2(d.getMonth()+1); }
function parse(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function shiftMonth(m, k){ const [y,mo] = m.split('-').map(Number); return ym(new Date(y, mo-1+k, 1)); }
const WEEK = ['日','一','二','三','四','五','六'];
function dayLabel(s){ const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}（${WEEK[d.getDay()]}）`; }

/* ---------- 定期收支 ---------- */
function runRecurring(){
  const today = new Date(); today.setHours(0,0,0,0);
  let added = 0;
  for(const r of db.recurring){
    let cur = r.last ? parse(r.last) : parse(r.start);
    if(r.last) cur.setDate(cur.getDate()+1);
    if(cur > today) continue;
    for(; cur <= today; cur.setDate(cur.getDate()+1)){
      const dim = new Date(cur.getFullYear(), cur.getMonth()+1, 0).getDate();
      const hit = r.freq === 'daily' || (r.freq === 'weekly' && cur.getDay() === r.day)
               || (r.freq === 'monthly' && cur.getDate() === Math.min(r.day, dim))
               || (r.freq === 'yearly' && cur.getMonth() + 1 === r.month && cur.getDate() === Math.min(r.day, dim));
      const date = ymd(cur);
      if(hit && !db.records.some(x => x.ruleId === r.id && x.date === date)){
        // 固定 id：多台設備各自補記同一天時會寫到同一份雲端文件，不會重複
        db.records.push({id:`rr_${r.id}_${date}`, type:r.type, amount:r.amount, catId:r.catId, date, note:r.note, ruleId:r.id, accId:r.accId || defaultAcc().id});
        added++;
      }
    }
    r.last = ymd(today);
  }
  if(added){ save(); toast(`已自動加入 ${added} 筆定期收支`); }
}

/* ---------- 畫面骨架 ---------- */
function newDraft(type){
  const first = db.categories.find(c => c.type === type && !c.hidden);
  let accId = defaultAcc().id;
  try{ const l = localStorage.getItem('ledger.acc'); if(l && acc(l)) accId = l; }catch(e){}
  const other = db.accounts.find(a => a.id !== accId);
  return {type, amount:'', catId:type === 'transfer' ? null : (first ? first.id : null), date:ymd(new Date()), note:'',
          editId:null, accId, toAccId:other ? other.id : accId};
}
const TABS = [['add','✏️','記帳'],['list','📋','明細'],['stats','📊','統計'],['acc','🏦','帳戶'],['set','⚙️','設定']];
/* 登入關卡：同步狀態由 Firebase 模組更新；還沒登入或還沒載入完帳本時，只顯示這個畫面 */
window.syncState = {status:'init', email:'', msg:'', ready:false};
let gateFailed = false;
function gateView(){
  const s = window.syncState;
  if(!window.Sync){
    return gateBox(gateFailed
      ? `<p class="sub">無法載入登入功能，請確認網路後重試。</p><button class="btn pri" onclick="location.reload()">重新載入</button>`
      : `<p class="sub">載入中…</p>`);
  }
  if(s.status === 'init') return gateBox(`<p class="sub">載入中…</p>`);
  if(s.status === 'off') return gateBox(`
    <p class="sub">請先登入 Google 帳號。你的記錄會存在自己的帳號底下，換手機或電腦登入同一個帳號就能同步。</p>
    <button class="btn pri" style="width:100%" onclick="Sync.login()">使用 Google 登入</button>`);
  if(!s.ready){
    return gateBox(s.status === 'error'
      ? `<p class="sub">同步發生問題：${esc(s.msg)}</p>
         <div class="row"><button class="btn sp" onclick="location.reload()">重試</button><button class="btn sp" onclick="Sync.logout()">登出</button></div>`
      : `<p class="sub">正在載入你的帳本…</p>
         ${s.slow ? `<p class="sub">等待時間比預期久，請確認網路連線。</p>` : ''}
         ${(s.errs || []).map(e => `<p class="sub" style="font-size:.75rem;word-break:break-all">錯誤：${esc(e)}</p>`).join('')}
         <div class="row" style="justify-content:center"><button class="btn sm" onclick="location.reload()">重新載入</button>
         <button class="btn sm" onclick="Sync.logout()">登出</button></div>`);
  }
  return null;
}
function gateBox(inner){
  return `<div style="text-align:center;padding:18vh 8px 0"><div style="font-size:3rem">💰</div>
    <h1 style="margin:8px 0 12px">輕鬆記帳</h1>${inner}</div>`;
}
setTimeout(() => { if(!window.Sync){ gateFailed = true; render(); } }, 10000);
// 把未捕捉的錯誤顯示在登入關卡上，方便除錯
function noteError(m){
  const s = window.syncState; s.errs = (s.errs || []).concat(String(m)).slice(-3);
  if(!s.ready) render();
}
addEventListener('error', e => noteError(e.message));
addEventListener('unhandledrejection', e => noteError(e.reason && (e.reason.code || e.reason.message) || e.reason));

function render(){
  const g = gateView();
  $('nav').parentElement.style.display = g ? 'none' : '';
  if(g){ $('app').innerHTML = g; return; }
  $('nav').innerHTML = TABS.map(([k,i,n]) =>
    `<button class="${st.tab===k?'on':''}" onclick="go('${k}')"><b>${i}</b>${n}</button>`).join('');
  $('app').innerHTML = {add:vAdd, list:vList, stats:vStats, acc:vAcc, set:vSet}[st.tab]();
}
function go(tab){
  if(tab === 'add' && st.tab !== 'add' && !st.draft.editId) st.draft = newDraft(st.draft.type);
  st.tab = tab; render(); scrollTo(0,0);
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 2600);
}
function openModal(html){ $('box').innerHTML = html; $('modal').classList.add('show'); }
function closeModal(){ $('modal').classList.remove('show'); }
$('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

/* ---------- 記帳 ---------- */
function vAdd(){
  const d = st.draft, isT = d.type === 'transfer';
  const cats = db.categories.filter(c => c.type === d.type && (!c.hidden || c.id === d.catId));
  return `
  <div class="seg">
    <button class="${d.type==='expense'?'on':''}" onclick="setType('expense')">支出</button>
    <button class="${d.type==='income'?'on':''}" onclick="setType('income')">收入</button>
    <button class="${isT?'on':''}" onclick="setType('transfer')">轉帳</button>
  </div>
  <div class="amount ${d.type==='expense'?'exp':d.type==='income'?'inc':''}" id="amt">${amtText()}</div>
  ${isT ? `<div class="card">
      <div class="row field"><span class="sub" style="width:48px">轉出</span><select onchange="st.draft.accId=this.value">${accOptions(d.accId)}</select></div>
      <div class="row" style="margin:0"><span class="sub" style="width:48px">轉入</span><select onchange="st.draft.toAccId=this.value">${accOptions(d.toAccId)}</select></div>
    </div>` : `<div class="cats">${cats.map(c => `
    <button class="cat ${c.id===d.catId?'on':''}" onclick="pickCat('${c.id}')"><i>${esc(c.icon)}</i>${esc(c.name)}</button>`).join('')}
    <button class="cat ${d.catId===null?'on':''}" onclick="pickCat(null)"><i>❓</i>未分類</button>
  </div>
  <div class="row field"><span class="sub" style="width:48px">帳戶</span>
    <select onchange="st.draft.accId=this.value;rememberAcc(this.value)">${accOptions(d.accId)}</select></div>`}
  <div class="row field">
    <input type="date" value="${d.date}" onchange="st.draft.date=this.value||st.draft.date" style="flex:1">
    <input type="text" placeholder="備註" value="${esc(d.note)}" oninput="st.draft.note=this.value" style="flex:2">
  </div>
  <div class="pad">
    ${[7,8,9].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}<button onclick="key('<')">⌫</button>
    ${[4,5,6].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}
    <button class="save" onclick="saveRecord()">${d.editId?'更新':'儲存'}</button>
    ${[1,2,3].map(k=>`<button onclick="key('${k}')">${k}</button>`).join('')}
    <button onclick="key('0')">0</button><button onclick="key('00')">00</button><button onclick="key('.')">.</button>
  </div>
  ${d.editId ? `<div class="row">
    <button class="btn" onclick="cancelEdit()">取消編輯</button><span class="sp"></span>
    <button class="btn dng" onclick="delRecord('${d.editId}')">刪除這筆</button></div>` : ''}`;
}
function amtText(){ return money(st.draft.amount === '' ? 0 : st.draft.amount.replace(/\.$/,'')) + (st.draft.amount.endsWith('.') ? '.' : ''); }
function setType(t){
  const o = st.draft;
  st.draft = {...newDraft(t), date:o.date, note:o.note, amount:o.amount, editId:o.editId, accId:o.accId, toAccId:o.toAccId};
  if(t === 'transfer' && st.draft.accId === st.draft.toAccId){
    const other = db.accounts.find(a => a.id !== st.draft.accId);
    if(other) st.draft.toAccId = other.id;
  }
  render();
}
function pickCat(id){ st.draft.catId = id; render(); }
function key(k){
  let a = st.draft.amount;
  if(k === '<') a = a.slice(0,-1);
  else if(k === '.'){ if(!a.includes('.')) a = (a || '0') + '.'; }
  else {
    if(a.includes('.') && a.split('.')[1].length >= 2) return;
    if(a === '0' && k !== '00') a = '';
    if(a === '' && k === '00') return;
    if(a.replace('.','').length >= 10) return;
    a += k;
  }
  st.draft.amount = a; $('amt').textContent = amtText();
}
function saveRecord(){
  const d = st.draft, amount = parseFloat(d.amount);
  if(!(amount > 0)){ toast('請輸入金額'); return; }
  const isT = d.type === 'transfer';
  if(isT && d.accId === d.toAccId){ toast(db.accounts.length < 2 ? '請先到「帳戶」新增另一個帳戶' : '轉出與轉入帳戶不能相同'); return; }
  const fields = {type:d.type, amount, catId:isT ? null : d.catId, date:d.date, note:d.note, accId:d.accId, toAccId:isT ? d.toAccId : undefined};
  if(d.editId) Object.assign(db.records.find(x => x.id === d.editId), fields);
  else db.records.push({id:uid(), ...fields});
  save();
  const wasEdit = !!d.editId;
  const warn = d.type === 'expense' ? budgetWarning(d.date.slice(0,7), d.catId) : '';
  st.draft = newDraft(d.type);
  if(wasEdit){ st.tab = 'list'; }
  render();
  toast(warn || (wasEdit ? '已更新' : '已記一筆'));
}
function cancelEdit(){ st.draft = newDraft(st.draft.type); st.tab = 'list'; render(); }
function delRecord(id){
  if(!confirm('確定刪除這筆記錄？')) return;
  db.records = db.records.filter(r => r.id !== id); save();
  st.draft = newDraft(st.draft.type); st.tab = 'list'; render(); toast('已刪除');
}
function budgetWarning(month, catId){
  const spent = sumBy(month, 'expense');
  const msgs = [];
  const chk = (label, used, limit) => {
    if(!limit) return;
    const p = used / limit;
    if(p >= 1) msgs.push(`${label}已超出預算`);
    else if(p >= 0.8) msgs.push(`${label}已用 ${Math.round(p*100)}%`);
  };
  chk('本月總預算', spent.total, db.budgets.total);
  if(catId) chk(cat(catId).name + '預算', spent.by[catId] || 0, db.budgets.cats[catId]);
  return msgs.join('，');
}

/* ---------- 明細 ---------- */
function monthRecords(m){ return db.records.filter(r => r.date.startsWith(m)); }
function sumBy(m, type){
  const by = {}; let total = 0;
  for(const r of monthRecords(m)) if(r.type === type){ total += r.amount; by[r.catId] = (by[r.catId]||0) + r.amount; }
  return {total, by};
}
function monthNav(){
  const [y,m] = st.month.split('-');
  return `<div class="month"><button onclick="moveMonth(-1)" aria-label="上個月">‹</button>

      <input type="month" id="mpick" value="${st.month}" onchange="setMonth(this.value)" tabindex="-1" aria-hidden="true"
        style="position:absolute;left:0;bottom:0;width:100%;height:1px;opacity:0;pointer-events:none;padding:0;border:0"></span>
    <button onclick="moveMonth(1)" aria-label="下個月">›</button></div>`;
}
function moveMonth(k){ st.month = shiftMonth(st.month, k); render(); }
function setMonth(v){ if(/^\d{4}-\d{2}$/.test(v)){ st.month = v; render(); } }
function pickMonth(){

function recItem(r){

  const where = isT ? `${a.name} → ${to ? to.name : '?'}` : (db.accounts.length > 1 ? a.name : '');

      ${note?`<div class="sub">${esc(note)}</div>`:''}</div>

function editRecord(id){
  const r = db.records.find(x => x.id === id);

  st.draft = {type:r.type, amount:String(r.amount), catId:r.catId, date:r.date, note:r.note||'', editId:id,

/* ---------- 統計與預算 ---------- */
function vStats(){
  const s = sumBy(st.month, st.statType);
  const rows = Object.entries(s.by).map(([id,v]) => ({c:cat(id==='null'?null:id), v})).sort((a,b) => b.v - a.v);
  return monthNav() + `
  <div class="seg">
    <button class="${st.statType==='expense'?'on':''}" onclick="st.statType='expense';render()">支出</button>
    <button class="${st.statType==='income'?'on':''}" onclick="st.statType='income';render()">收入</button>
  </div>
  ${st.statType==='expense' ? budgetCard() : ''}
  <div class="card">
    <div class="row" style="align-items:center">
      ${donut(rows, s.total)}
      <div class="sp"><div class="sub">本月${st.statType==='expense'?'支出':'收入'}</div><b style="font-size:1.3rem">${money(s.total)}</b></div>
    </div>
    ${rows.length ? rows.map(r => `
      <div style="margin-top:12px"><div class="row"><span>${esc(r.c.icon)} ${esc(r.c.name)}</span><span class="sp"></span>
        <span class="sub">${Math.round(r.v/s.total*100)}%</span><b>${money(r.v)}</b></div>
        <div class="bar"><span style="width:${r.v/s.total*100}%;background:${r.c.color}"></span></div></div>`).join('')
      : '<div class="empty">沒有資料</div>'}
  </div>
  ${rangeSection()}`;
}
function donut(rows, total, solid){
  // solid：實心圓餅（粗線畫滿半徑）；否則是環狀圖
  const R = solid ? 25 : 40, W = solid ? 50 : 16, size = solid ? 150 : 120, C = 2*Math.PI*R;
  let off = 0;
  const segs = total ? rows.map(r => {
    const len = r.v/total*C;
    const el = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${r.c.color}" stroke-width="${W}"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;
    off += len; return el;
  }).join('') : '';
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="分類占比圖">
    <circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--chip)" stroke-width="${W}"/>${segs}</svg>`;
}
function rangeSection(){
  const n = st.range;
  const ms = Array.from({length:n}, (_,i) => shiftMonth(st.month, i - n + 1));
  const set = new Set(ms), by = {};
  let total = 0;
  for(const r of db.records) if(r.type === st.statType && set.has(r.date.slice(0,7))){
    total += r.amount; by[r.catId] = (by[r.catId] || 0) + r.amount;
  }
  const rows = Object.entries(by).map(([id,v]) => ({c:cat(id==='null'?null:id), v})).sort((a,b) => b.v - a.v);
  const label = st.statType === 'expense' ? '支出' : '收入';
  return `<div class="row" style="margin:18px 0 8px"><h2 class="sp" style="margin:0">收支趨勢</h2>
      <span class="sub">截至本月，往前</span>
      <select style="width:auto" onchange="setRange(this.value)" aria-label="顯示月數">
        ${Array.from({length:36}, (_,i) => i + 1).map(k => `<option value="${k}" ${k===n?'selected':''}>${k} 個月</option>`).join('')}
      </select></div>
    <div class="card">${bars(ms)}</div>
    <h2>${n} 個月的${label}分類占比</h2>
    <div class="card">
      <div class="row" style="justify-content:center">${donut(rows, total, true)}</div>
      <div class="sub" style="text-align:center;margin:6px 0">合計 ${money(total)}</div>
      ${rows.length ? rows.map(r => `
        <div class="row" style="margin-top:8px"><span class="ico" style="width:14px;height:14px;background:${r.c.color}"></span>
          <span>${esc(r.c.icon)} ${esc(r.c.name)}</span><span class="sp"></span>
          <span class="sub">${Math.round(r.v/total*100)}%</span><b>${money(r.v)}</b></div>`).join('')
        : '<div class="empty">沒有資料</div>'}
    </div>`;
}
function setRange(v){
  st.range = Math.min(36, Math.max(1, parseInt(v) || 6));
  try{ localStorage.setItem('ledger.range', st.range); }catch(e){}
  render();
}
function bars(ms){
  const data = ms.map(m => ({m, i:sumBy(m,'income').total, e:sumBy(m,'expense').total}));
  const max = Math.max(1, ...data.flatMap(d => [d.i, d.e]));
  const H = 110, W = 300, slot = W / ms.length, bw = Math.min(17, slot * 0.38);
  const step = ms.length <= 12 ? 1 : ms.length <= 24 ? 2 : 3;
  const fs = ms.length <= 6 ? 11 : 9;
  return `<svg viewBox="0 0 ${W} ${H+34}" width="100%" role="img" aria-label="各月收支長條圖">
    ${data.map((d,k) => {
      const x = k*slot + (slot - bw*2 - 2)/2, hi = d.i/max*H, he = d.e/max*H;
      const show = (ms.length - 1 - k) % step === 0;
      return `<rect x="${x}" y="${H-hi}" width="${bw}" height="${hi}" rx="2" fill="var(--income)"/>
        <rect x="${x+bw+2}" y="${H-he}" width="${bw}" height="${he}" rx="2" fill="var(--expense)"/>
        ${show ? `<text x="${x+bw+1}" y="${H+16}" font-size="${fs}" text-anchor="middle" fill="var(--sub)">${+d.m.slice(5)}月</text>` : ''}`;
    }).join('')}
  </svg>
  <div class="row sub" style="justify-content:center;gap:16px">
    <span><span class="inc">■</span> 收入</span><span><span class="exp">■</span> 支出</span></div>`;
}
function budgetCard(){
  const s = sumBy(st.month, 'expense');
  const items = [];
  if(db.budgets.total) items.push({label:'💰 本月總預算', used:s.total, limit:db.budgets.total});
  for(const [id,limit] of Object.entries(db.budgets.cats)){
    const c = db.categories.find(x => x.id === id);
    if(c && limit) items.push({label:`${c.icon} ${c.name}`, used:s.by[id]||0, limit});
  }
  if(!items.length) return `<div class="card row"><span class="sub sp">還沒設定預算</span>
    <button class="btn sm" onclick="budgetModal()">設定預算</button></div>`;
  return `<div class="card"><div class="row"><b class="sp">預算</b><button class="btn sm" onclick="budgetModal()">調整</button></div>
    ${items.map(it => {
      const p = it.used/it.limit;
      const color = p>=1 ? 'var(--danger)' : p>=0.8 ? 'var(--warn)' : 'var(--accent)';
      const left = it.limit - it.used;
      return `<div style="margin-top:12px"><div class="row"><span>${esc(it.label)}</span><span class="sp"></span>
        <span class="sub">${money(it.used)} / ${money(it.limit)}</span></div>
        <div class="bar"><span style="width:${Math.min(100,p*100)}%;background:${color}"></span></div>
        <div class="sub" style="color:${p>=1?'var(--danger)':'var(--sub)'}">${left>=0?'剩餘 '+money(left):'超出 '+money(-left)}</div></div>`;
    }).join('')}</div>`;
}
function budgetModal(){
  const ex = db.categories.filter(c => c.type === 'expense');
  openModal(`<h2 style="margin-top:0">預算設定（每月）</h2>
    <div class="field"><label>每月總預算（留空或 0 表示不設）</label>
      <input id="b_total" type="number" inputmode="decimal" min="0" value="${db.budgets.total||''}"></div>
    <div class="sub" style="margin-bottom:6px">分類預算</div>
    ${ex.map(c => `<div class="row field"><span style="width:110px">${esc(c.icon)} ${esc(c.name)}</span>
      <input id="b_${c.id}" type="number" inputmode="decimal" min="0" value="${db.budgets.cats[c.id]||''}"></div>`).join('')}

      <button class="btn pri sp" onclick="saveBudget()">儲存</button></div>`);

function saveBudget(){

  db.budgets.total = num('b_total');

}

  const a = db.categories.indexOf(same[i]), b = db.categories.indexOf(same[j]);
  [db.categories[a], db.categories[b]] = [db.categories[b], db.categories[a]];

function download(name, text, type){

/* 不靠外部套件的最小 xlsx 產生器：xlsx 就是一個 zip，這裡用「不壓縮」模式打包 */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for(let n = 0; n < 256; n++){ let c = n; for(let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t;
})();
function crc32(b){ let c = 0xFFFFFFFF; for(let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files, mime){
  const enc = new TextEncoder(), parts = [], central = [];
  let off = 0;
  for(const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data), size = data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true);
    lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true);
    ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, off, true);
    central.push(new Uint8Array(ch.buffer), name);
    off += 30 + name.length + size;
  }
  const cdSize = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:mime});
}
function exportXlsx(){
  const x = s => esc(String(s ?? '').replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, ''));

    .concat(recs.map((r,i) => {

      return `<row r="${n}">` + str('A'+n, r.date) + str('B'+n, typeName[r.type] || r.type) + str('C'+n, isT ? '' : cat(r.catId).name)
        + str('D'+n, isT ? `${accOf(r).name} → ${to ? to.name : ''}` : accOf(r).name)
        + `<c r="E${n}"><v>${r.amount}</v></c>` + str('F'+n, r.note) + '</row>';
    }));
  const NS = 'http://schemas.openxmlformats.org/spreadsheetml/2006/main';
  const REL = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';
  const head0 = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const blob = zipStore([
    {name:'[Content_Types].xml', text:head0 + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'},
    {name:'_rels/.rels', text:head0 + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml', text:head0 + `<workbook xmlns="${NS}" xmlns:r="${REL}"><sheets><sheet name="記帳明細" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels', text:head0 + `<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/></Relationships>`},
    {name:'xl/styles.xml', text:head0 + `<styleSheet xmlns="${NS}"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs></styleSheet>`},
    {name:'xl/worksheets/sheet1.xml', text:head0 + `<worksheet xmlns="${NS}"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols><col min="1" max="1" width="13" customWidth="1"/><col min="2" max="2" width="8" customWidth="1"/><col min="3" max="3" width="14" customWidth="1"/><col min="4" max="4" width="18" customWidth="1"/><col min="5" max="5" width="12" customWidth="1"/><col min="6" max="6" width="30" customWidth="1"/></cols><sheetData>${rows.join('')}</sheetData></worksheet>`}
  ], 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  download(`記帳明細-${ymd(new Date())}.xlsx`, blob);
}
$('file').addEventListener('change', async e => {

    db = {categories:d.categories, records:d.records, budgets:d.budgets || {total:0,cats:{}}, recurring:d.recurring || [], accounts:d.accounts};

/* 提供給雲端同步模組使用 */

<script type="module">

const app = initializeApp({
  apiKey: "AIzaSyDWFtQ_Euyat9DzWcqoMA33-0SRomFtWQ4",
  authDomain: "expense-tracker-8acf3.firebaseapp.com",
  projectId: "expense-tracker-8acf3",
  storageBucket: "expense-tracker-8acf3.firebasestorage.app",

const fs = initializeFirestore(app, {localCache: persistentLocalCache(), experimentalAutoDetectLongPolling: true});

const sdoc = () => doc(fs, 'users', uid, 'meta', 'settings');

function onData(){
  if(!(gotRecs && gotSet)) return;
  let first = false;

    const recs = recsData.slice();
    if(!linked){   // 這支手機第一次連到此帳號：把本機記錄併入雲端
      const ids = new Set(recs.map(r => r.id));
      localBefore.records.forEach(r => { if(!ids.has(r.id)) recs.push(r); });

    localStorage.setItem('ledger.uid', uid);

  } else {
    App.db = {...clean(setData || settingsOf(App.db)), records:recsData};

function attach(){

    if(snap.metadata.fromCache && snap.empty) return;   // 等伺服器回應，避免把空的快取當成雲端內容

    gotRecs = true; onData();
  }, fail));
  unsubs.push(onSnapshot(sdoc(), meta, snap => {
    if(snap.metadata.fromCache && !snap.exists()) return;
    setData = snap.exists() ? snap.data() : null;
    cloudSetJson = setData ? stable(setData) : null;
    gotSet = true; onData();

function detach(){

onAuthStateChanged(auth, user => {

  S.ready = false;
  if(!user){ uid = null; S.status = 'off'; S.email = ''; refresh(); return; }
  uid = user.uid; S.email = user.email || ''; S.status = 'loading';
  localBefore = clean(App.db);
  const prev = localStorage.getItem('ledger.uid');
  if(prev && prev !== uid && localBefore.records.length &&
     !confirm('這支手機上有另一個帳號的記錄。要把它們合併上傳到目前登入的帳號嗎？\n選「取消」會清空本機資料，只使用此帳號的雲端資料。')){
    localBefore = {categories:clean(App.DEFAULT_CATS), records:[], budgets:{total:0, cats:{}}, recurring:[]};
  }
  S.slow = false;
  setTimeout(() => { if(uid === user.uid && !S.ready){ S.slow = true; refresh(); } }, 15000);
  refresh();
  try{ attach(); } catch(e){ fail(e); }
});

window.Sync = {
  push,
  async login(){
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ App.toast('登入失敗：' + (e.code || e.message)); }
  },
  async logout(){
    localStorage.removeItem('ledger.linked');   // 下次登入時會再把本機新增的記錄併入
    await signOut(auth);
    App.toast('已登出，記錄仍保留在這支手機');
  }
};
refresh();
</script>
</body>
</html>
